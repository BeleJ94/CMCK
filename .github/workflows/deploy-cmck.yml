name: 🚀 Déploiement automatique CMCK

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to CMCK VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST_CMCK }}
          username: ${{ secrets.VPS_USER_CMCK }}
          key: ${{ secrets.VPS_SSH_KEY_CMCK }}

          script: |
            set -e

            cd /var/www/vhosts/belej-erp.com/cmck.belej-erp.com

            echo "=== Current branch ==="
            git branch --show-current

            echo "=== Fetching GitHub ==="
            git fetch origin main

            echo "=== Updating application ==="
            git pull --ff-only origin main

            echo "=== Updating permissions ==="
            find . -type d -not -path "./.git*" -exec chmod 755 {} \;
            find . -type f -not -path "./.git/*" -exec chmod 644 {} \;

            echo "=== Deployment completed ==="
            git log -1 --oneline