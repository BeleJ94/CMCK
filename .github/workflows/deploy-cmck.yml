name: 🚀 Déploiement automatique CMCK

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST_CMCK }}
          username: ${{ secrets.VPS_USER_CMCK }}
          key: ${{ secrets.VPS_SSH_KEY_CMCK }}
          script: |
            cd /var/www/vhosts/belej-erp.com/cmck.belej-erp.com
            git pull origin main
            sudo chown -R www-data:www-data .
            sudo find . -type d -exec chmod 755 {} \;
            sudo find . -type f -exec chmod 644 {} \;