name: 🚀 Déploiement automatique CMCK

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to CMCK VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST_CMCK }}
          username: ${{ secrets.VPS_USER_CMCK }}
          key: ${{ secrets.VPS_SSH_KEY_CMCK }}

          script: |
            set -e

            cd /var/www/vhosts/belej-erp.com/cmck.belej-erp.com

            echo "=== Fetching GitHub ==="
            git fetch origin main

            echo "=== Deploying ==="
            git reset --hard origin/main

            echo "=== Current version ==="
            git log -1 --oneline

            echo "=== Deployment completed ==="